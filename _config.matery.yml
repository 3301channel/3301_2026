# =========================================================
# Matery 主题配置（3301 channel）
# 基于原站点保留个性化：蓝绿渐变、banner、live2d 看板娘等
# =========================================================

# 导航菜单
menu:
  Index:
    url: /
    icon: fas fa-home
  Tags:
    url: /tags
    icon: fas fa-tags
  Categories:
    url: /categories
    icon: fas fa-bookmark
  Archives:
    url: /archives
    icon: fas fa-archive
  About:
    url: /about
    icon: fas fa-user-circle
  Contact:
    url: /contact
    icon: fas fa-comments
  OldBlog:
    url: https://3301channel.github.io
    icon: fas fa-clock-rotate-left

# 站点运行时间（可选）
time:
  enable: true
  year: 2022
  month: 03
  date: 16
  hour: 00
  minute: 00
  second: 00

# 首页封面轮播图
cover:
  showPrevNext: true
  showIndicators: true
  autoLoop: true
  duration: 120
  intervalTime: 5000
  useConfig: false

# 首页梦想语句
dream:
  enable: true
  showTitle: true
  title: 我的梦想
  text: 不是每个人都应该像我这样去建造一座水晶大教堂，但是每个人都应该拥有自己的梦想，设计自己的梦想，追求自己的梦想，实现自己的梦想。梦想是生命的灵魂，是心灵的灯塔，是引导人走向成功的信仰。——罗伯·舒乐

# 首页音乐
music:
  enable: true
  title:
    enable: true
    show: 听听音乐
  autoHide: true
  server: netease
  type: playlist
  id: 503838841
  fixed: true
  autoplay: false
  theme: '#42b983'
  loop: 'all'
  order: 'random'
  preload: 'auto'
  volume: 0.7
  listFolded: true
  hideLrc: true

# 推荐文章标题
recommend:
  enable: true
  showTitle: true
  useConfig: false

# 网站 favicon 与 LOGO
favicon: /favicon.png
logo: /medias/logo.png

# 首页 banner 第二个按钮
indexbtn:
  enable: true
  name: Github
  icon: fab fa-github-alt
  url: https://github.com/abc3301/hexo-theme-matery

# 首页 banner 第二行个人信息
socialLink:
  github: https://github.com/abc3301
  email: 2797459022@qq.com
  facebook:
  twitter:
  qq: 2797459022
  weibo:
  zhihu:
  rss: true

# 文章目录
toc:
  enable: true
  heading: h2, h3, h4
  collapseDepth: 0
  showToggleBtn: true

# 代码块
code:
  lang: true
  copy: true
  shrink: true
  break: false

# 打赏
reward:
  enable: true
  title: 你的赏识是我前进的动力
  wechat: /medias/reward/wechat.png
  alipay: /medias/reward/alipay.jpg

# 复制版权信息
copyright:
  enable: false
  minCharNumber: 120
  description: 本文章著作权归作者所有，任何形式的转载都请注明出处。

# 数学公式
mathjax:
  enable: false

# 文章信息：字数统计 / 阅读时长
postInfo:
  date: true
  update: false
  wordCount: true
  totalCount: true
  min2read: true
  readCount: false

# 点击爱心效果
clicklove:
  enable: true

# 页面特效（三选一，默认关闭以保持清爽）
sakura:
  enable: false
mouseStar:
  enable: false
snowdown:
  enable: false

# 关于页面：个人信息
profile:
  avatar: /medias/avatar.png
  career: Software Engineer
  introduction: If you wish to succeed, you should use persistence as your good friend, experience as your reference, prudence as your brother and hope as your sentry.

# 关于页面：我的项目
myProjects:
  enable: true
  data:
    hexo-theme-matery:
      icon: fas fa-file-alt
      iconBackground: 'linear-gradient(to bottom right, #66BB6A 0%, #81C784 100%)'
      url: https://github.com/abc3301/hexo-theme-matery
      desc: This is a Hexo blog theme with 'Material Design' and responsive design.
    Fenix:
      icon: fas fa-database
      iconBackground: 'linear-gradient(to bottom right, #F06292 0%, #EF5350 100%)'
      url: https://github.com/blinkfox/fenix
      desc: 这是 Spring Data JPA 复杂或动态 SQL 查询的扩展库。
    typora-vue-theme:
      icon: fas fa-file-alt
      iconBackground: 'linear-gradient(to bottom right, #29B6F6 0%, #1E88E5 100%)'
      url: https://github.com/blinkfox/typora-vue-theme
      desc: This is a typora theme inspired by Vue document style.

# 关于页面：我的技能
mySkills:
  enable: true
  data:
    Java:
      background: 'linear-gradient(to right, #FF0066 0%, #FF00CC 100%)'
      percent: 85%
    JavaScript:
      background: 'linear-gradient(to right, #9900FF 0%, #CC66FF 100%)'
      percent: 80%
    HTML5:
      background: 'linear-gradient(to right, #2196F3 0%, #42A5F5 100%)'
      percent: 80%
    CSS:
      background: 'linear-gradient(to right, #00BCD4 0%, #80DEEA 100%)'
      percent: 70%
    SQL:
      background: 'linear-gradient(to right, #4CAF50 0%, #81C784 100%)'
      percent: 90%
    程序设计:
      background: 'linear-gradient(to right, #FFEB3B 0%, #FFF176 100%)'
      percent: 75%

